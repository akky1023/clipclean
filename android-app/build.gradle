plugins {
    id 'com.android.application' version '8.9.2'
}

android {
    namespace 'clipclean.android'
    compileSdk 35

    defaultConfig {
        applicationId 'net.neomenia.clipclean'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.1.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':core')
}

tasks.register('debugApk', Copy) {
    dependsOn 'assembleDebug'
    from layout.buildDirectory.file('outputs/apk/debug/android-app-debug.apk')
    into rootProject.layout.projectDirectory.dir('dist')
    rename { 'ClipClean-Android-debug.apk' }
}
